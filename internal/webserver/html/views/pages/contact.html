{{define "contact"}}
<div class="contact-page">
    <div class="contact-container">
        <div class="contact-info">
            <div class="contact-info-content">
                <h2>Let's Connect</h2>
                <p>Have a project in mind or just want to chat? I'd love to hear from you.</p>
                <div class="contact-details">
                    <div class="contact-detail-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="5" width="18" height="14" rx="2" />
                            <path d="M3 7l9 6 9-6" />
                        </svg>
                        <span>isaac@irowell.io</span>
                    </div>
                    <div class="contact-detail-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                        <span>Canada</span>
                    </div>
                </div>
                <div class="contact-socials">
                    <h3>Find me on</h3>
                    <div class="social-links">
                        <a href="https://github.com/isaacgr" target="_blank" aria-label="GitHub">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 .5C5.73.5.99 5.24.99 11.51c0 4.85 3.15 8.96 7.51 10.41.55.1.75-.24.75-.53 0-.26-.01-1.13-.02-2.06-3.06.67-3.71-1.31-3.71-1.31-.5-1.27-1.22-1.61-1.22-1.61-.99-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.67 2.57 1.19 3.2.91.1-.71.38-1.19.68-1.47-2.44-.28-5-1.22-5-5.43 0-1.2.43-2.17 1.13-2.94-.11-.28-.49-1.41.11-2.94 0 0 .92-.29 3.02 1.12a10.4 10.4 0 0 1 5.5 0c2.1-1.41 3.02-1.12 3.02-1.12.6 1.53.22 2.66.11 2.94.7.77 1.13 1.74 1.13 2.94 0 4.22-2.57 5.15-5.01 5.43.39.34.73 1.01.73 2.04 0 1.47-.01 2.66-.01 3.02 0 .29.2.64.76.53 4.35-1.45 7.5-5.56 7.5-10.41C23.02 5.24 18.28.5 12 .5z"/>
                            </svg>
                        </a>
                        <a href="https://www.linkedin.com/in/isaac-gluchowski-rowell-81882b98/" target="_blank" aria-label="LinkedIn">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M4.98 3.5C4.98 4.88 3.9 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1 4.98 2.12 4.98 3.5zM0 8h5v16H0zM8 8h4.8v2.2h.07c.67-1.2 2.3-2.46 4.73-2.46C22.4 7.74 24 10 24 13.8V24h-5v-8.6c0-2.05-.04-4.7-2.86-4.7-2.86 0-3.3 2.24-3.3 4.56V24H8z"/>
                            </svg>
                        </a>
                        <a href="https://x.com/isaacgrowell" target="_blank" aria-label="X/Twitter">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932L18.901 1.153ZM17.61 20.644h2.039L6.486 3.24H4.298L17.61 20.644Z"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="contact-form-section">
            <form
                id="contactForm"
                hx-post="/contact"
                hx-target="#form-resp"
                hx-target-error="#form-resp"
                hx-validate
                hx-disabled-elt="#submit-contact"
            >
                <h1>Send a Message</h1>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            placeholder="John Doe"
                        />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="john@example.com"
                        />
                    </div>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        placeholder="Project inquiry"
                    />
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        placeholder="Tell me about your project..."
                    ></textarea>
                </div>
                <input
                    type="checkbox"
                    name="contact_me_by_fax_only"
                    value="1"
                    tabindex="-1"
                    autocomplete="off"
                    id="fax"
                />
                <button
                    class="submit-btn"
                    type="submit"
                    id="submit-contact"
                    data-sitekey="6LebplksAAAAANNsb0uPPHDMeJQLGaV2I87ADELF"
                    data-callback="onSubmit"
                    data-action="login"
                >
                    <span>Send Message</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
                <div
                    id="g-recaptcha"
                    data-sitekey="6LebplksAAAAANNsb0uPPHDMeJQLGaV2I87ADELF"
                    data-action="login"
                ></div>
                <img
                    class="htmx-indicator"
                    src="/static/assets/loaders/bars.svg"
                />
                <div id="form-resp"></div>
            </form>
        </div>
    </div>
</div>
<script>
    if (window.grecaptcha && window.grecaptcha.render) {
        grecaptcha.enterprise.render("g-recaptcha", {
            sitekey: "6LebplksAAAAANNsb0uPPHDMeJQLGaV2I87ADELF",
        });
    }
</script>
{{end}}
