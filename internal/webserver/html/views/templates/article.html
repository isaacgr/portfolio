{{define "article"}}
<article class="article wrapper wrapper--narrow">
    <header class="article__header">
        <a
            class="text-link text-link--back"
            href="/blog"
            hx-get="/blog"
            hx-push-url="/blog"
            hx-swap="innerHTML show:window:top transition:true"
            hx-target="#main"
            hx-target-5*="#main"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M19 12H5M11 18l-6-6 6-6" />
            </svg>
            All posts
        </a>
        {{if .CreatedAt}}
        <p class="article__meta">
            <time datetime="{{.CreatedAt}}">{{formatDate .CreatedAt}}</time>
        </p>
        {{end}}
        <h1 class="article__title">{{.Title}}</h1>
        {{if .Tags}}
        <ul class="tag-list">
            {{range .Tags}}
            <li class="tag">{{.}}</li>
            {{end}}
        </ul>
        {{end}}
    </header>
    <div class="post">{{.Post}}</div>
</article>
{{end}}
